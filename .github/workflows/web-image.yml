name: Web image

# The web version as one container image (src-tauri/crates/server/Dockerfile):
# the server, serving the built frontend. Built on demand; pushed to the
# GitHub container registry, and deployed to Cloudflare (deploy/cloudflare),
# only when asked. Each release deploys it (release.yml, job `web`).
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image to ghcr.io'
        type: boolean
        default: false
      deploy:
        description: 'Deploy to Cloudflare'
        type: boolean
        default: false
  workflow_call:
    inputs:
      # Commit or tag to build (empty: the triggering one).
      ref:
        type: string
        default: ''
      push:
        type: boolean
        default: true
      deploy:
        type: boolean
        default: false

jobs:
  # The frontend build needs src/bindings.ts, which the desktop crate's tests
  # generate: built on Windows like CI (no extra system libraries).
  frontend:
    runs-on: windows-latest
    steps:
      - name: Checkout OpenTrader
        uses: actions/checkout@v7
        with:
          path: opentrader
          ref: ${{ inputs.ref }}

      - name: Read drawing core ref
        id: refs
        shell: bash
        working-directory: opentrader
        run: echo "drawing=$(node -p "require('./package.json').config.drawingRef")" >> "$GITHUB_OUTPUT"

      - name: Checkout drawing core
        uses: actions/checkout@v7
        with:
          repository: deepentropy/lightweight-charts-drawing
          ref: ${{ steps.refs.outputs.drawing }}
          path: lightweight-charts-drawing

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'opentrader/src-tauri -> target'

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: opentrader/package-lock.json

      - name: Install npm dependencies
        working-directory: opentrader
        run: npm ci

      - name: Generate bindings
        working-directory: opentrader/src-tauri
        run: cargo test --lib export_bindings

      - name: Build the web frontend
        working-directory: opentrader
        run: npm run build:web

      - name: Upload dist-web
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: opentrader/dist-web

  image:
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download dist-web
        uses: actions/download-artifact@v7
        with:
          name: dist-web
          path: dist-web

      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          version=$(node -p "require('./package.json').version")
          echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src-tauri/crates/server/Dockerfile
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container starts, serves the page compressed and answers the API
      # (no token here: a data call fails, the server must not).
      - name: Smoke test
        run: |
          image="${TAGS%%,*}"
          docker run -d --name web -p 8080:8080 "$image"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -sf -o /dev/null -D - -H 'Accept-Encoding: br' http://127.0.0.1:8080/ | grep -qi '^content-encoding: br'
          curl -sf -X POST http://127.0.0.1:8080/api/invoke/get_data_provider | grep -q gateway
          docker logs web
          docker rm -f web
        env:
          TAGS: ${{ steps.tags.outputs.tags }}

      - name: Push
        if: inputs.push
        run: for t in ${TAGS//,/ }; do docker push "$t"; done
        env:
          TAGS: ${{ steps.tags.outputs.tags }}

  # Cloudflare: the Worker serves dist-web and runs the server image as its
  # container (wrangler builds and pushes the image with Docker).
  deploy:
    needs: image
    if: inputs.deploy
    runs-on: ubuntu-latest
    concurrency: cloudflare-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download dist-web
        uses: actions/download-artifact@v7
        with:
          name: dist-web
          path: dist-web

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Install wrangler
        working-directory: deploy/cloudflare
        run: npm ci

      # Before the deploy, so the container's first start already has it.
      - name: Gateway token
        working-directory: deploy/cloudflare
        run: printf '%s' "$TOKEN" | npx wrangler secret put OPENTRADER_GATEWAY_TOKEN
        env:
          TOKEN: ${{ secrets.OPENTRADER_GATEWAY_TOKEN }}

      - name: Deploy
        working-directory: deploy/cloudflare
        run: npx wrangler deploy
