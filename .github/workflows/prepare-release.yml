name: Prepare release

# Cuts a release without manual steps (scripts/release-bump.mjs):
#   1. bumps oakscriptjs, lightweight-charts-indicators and the drawing core
#      (package.json config.drawingRef) to their latest release;
#   2. bumps the app version (patch, or minor on a manual run);
#   3. runs the CI checks on the result;
#   4. commits "OpenTrader <version>" to main, tags v<version>, pushes both;
#   5. runs the Release workflow for that tag, which publishes the release
#      once all installers are built.
# Triggers:
#   - daily: releases only when a library has a new version;
#   - manual (Actions tab -> "Run workflow"): releases when a library changed
#     or main has commits since the last version tag.
# Nothing is pushed when a check fails.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      part:
        description: 'Version part to bump'
        type: choice
        options: [patch, minor]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    permissions:
      contents: write            # push the version commit and tag
    outputs:
      release: ${{ steps.bump.outputs.release }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout OpenTrader
        uses: actions/checkout@v7
        with:
          path: opentrader
          ref: main
          fetch-depth: 0         # tags, for the commits since the last one

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: opentrader/package-lock.json

      - name: Install npm dependencies
        working-directory: opentrader
        run: npm ci

      - name: Bump libraries and version
        id: bump
        shell: bash
        working-directory: opentrader
        run: node scripts/release-bump.mjs ${{ github.event_name == 'schedule' && 'libs' || 'changes' }} ${{ inputs.part || 'patch' }}

      # The CI checks (ci.yml) on the bumped tree.
      - name: Read drawing core ref
        if: steps.bump.outputs.release == 'true'
        id: refs
        shell: bash
        working-directory: opentrader
        run: echo "drawing=$(node -p "require('./package.json').config.drawingRef")" >> "$GITHUB_OUTPUT"

      - name: Checkout drawing core
        if: steps.bump.outputs.release == 'true'
        uses: actions/checkout@v7
        with:
          repository: deepentropy/lightweight-charts-drawing
          ref: ${{ steps.refs.outputs.drawing }}
          path: lightweight-charts-drawing

      - name: Install Rust
        if: steps.bump.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.bump.outputs.release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'opentrader/src-tauri -> target'

      - name: Rust tests
        if: steps.bump.outputs.release == 'true'
        working-directory: opentrader/src-tauri
        run: cargo test --lib

      - name: Type check
        if: steps.bump.outputs.release == 'true'
        working-directory: opentrader
        run: npx tsc --noEmit -p .

      - name: Unit tests
        if: steps.bump.outputs.release == 'true'
        working-directory: opentrader
        run: npm test

      # Pushed with the workflow token: this triggers neither CI nor the tag
      # build, the release job below builds the tag.
      - name: Commit, tag and push
        if: steps.bump.outputs.release == 'true'
        shell: bash
        working-directory: opentrader
        run: |
          version="${{ steps.bump.outputs.version }}"
          git config user.name "OpenTrader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "OpenTrader $version"
          git tag "v$version"
          git push --atomic origin HEAD:main "v$version"

  release:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
    secrets: inherit
