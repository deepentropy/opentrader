[package]
name = "opentrader"
version = "0.4.20"
description = "OpenTrader: desktop charting app"
authors = ["OpenTrader contributors"]
license = "MIT"
repository = "https://github.com/deepentropy/opentrader"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The desktop app and the crates it shares with the web server; one lock file
# and one target folder (src-tauri/).
[workspace]
members = ["crates/core", "crates/server"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opentrader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opentrader-core = { path = "crates/core", features = ["tauri"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Durable, file-backed persistence for UI prefs + user data (drawings, layouts,
# alerts, watchlists). Replaces localStorage, which has a ~5 MB origin quota.
tauri-plugin-store = "2"
# Settings > Local data: the system folder picker (called from Rust only).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The AI assistant's requests (assistant.rs); features come with opentrader-core's.
reqwest = { version = "0.12", default-features = false }
# The assistant's model on this computer (local_model.rs): checksums, the server's archives, RAM and disk space.
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.22"
minisign-verify = "0.2"
tauri-plugin-updater = "2"
# `opentrader://` links from the Community website, delivered to the running app (deep_link.rs).
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Settings > Coding agents: the local MCP endpoint (agent.rs) and its token.
axum = "0.8"
getrandom = "0.3"

# The proxy password, in the system's encrypted credential store (Settings > Network).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
