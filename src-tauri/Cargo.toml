[package]
name = "opentrader"
version = "0.4.9"
description = "OpenTrader: desktop charting app"
authors = ["OpenTrader contributors"]
license = "MIT"
repository = "https://github.com/deepentropy/opentrader"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The desktop app and the crates it shares with the web server; one lock file
# and one target folder (src-tauri/).
[workspace]
members = ["crates/core", "crates/server"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opentrader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opentrader-core = { path = "crates/core", features = ["tauri"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Durable, file-backed persistence for UI prefs + user data (drawings, layouts,
# alerts, watchlists). Replaces localStorage, which has a ~5 MB origin quota.
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.22"
minisign-verify = "0.2"
tauri-plugin-updater = "2"

