[package]
name = "opentrader-server"
version = "0.0.0"
description = "OpenTrader web server: the app's commands over HTTP and its live events over WebSocket"
authors = ["OpenTrader contributors"]
license = "MIT"
repository = "https://github.com/deepentropy/opentrader"
edition = "2021"
publish = false

[dependencies]
# Without the `tauri` feature: no window system in the server.
opentrader-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
